apply plugin: 'com.android.application'

/**
 * PHASE 10 — versioning strategy.
 *
 * versionName  : semantic "MAJOR.MINOR.PATCH", set here and bumped per release.
 * versionCode  : monotonically increasing integer. CI supplies it through the
 *                ORG_GRADLE_PROJECT_versionCode / VERSION_CODE environment
 *                value so a build can never accidentally reuse a code that Play
 *                has already seen. Local builds fall back to the next code
 *                after the last Play upload (bump it with each release).
 * Signing      : release signing is supplied by the environment only. No
 *                keystore, password or alias is ever committed to this repo.
 */
def appVersionName = (System.getenv("VERSION_NAME") ?: project.findProperty("versionName") ?: "1.4.0").toString()
def appVersionCode = (System.getenv("VERSION_CODE") ?: project.findProperty("versionCode") ?: "16").toString().toInteger()
def signingEnvironment = [
    ANDROID_KEYSTORE_PATH: System.getenv("ANDROID_KEYSTORE_PATH"),
    ANDROID_KEYSTORE_PASSWORD: System.getenv("ANDROID_KEYSTORE_PASSWORD"),
    ANDROID_KEY_ALIAS: System.getenv("ANDROID_KEY_ALIAS"),
    ANDROID_KEY_PASSWORD: System.getenv("ANDROID_KEY_PASSWORD"),
]
def suppliedSigningKeys = signingEnvironment.findAll { key, value -> value }.keySet()
def missingSigningKeys = signingEnvironment.findAll { key, value -> !value }.keySet()
def signedReleaseRequired = (System.getenv("REQUIRE_SIGNED_RELEASE") ?: "false").toBoolean()

if (!suppliedSigningKeys.isEmpty() && !missingSigningKeys.isEmpty()) {
    throw new GradleException("Incomplete release signing configuration. Missing: ${missingSigningKeys.join(', ')}")
}
if (signedReleaseRequired && !missingSigningKeys.isEmpty()) {
    throw new GradleException("Signed release requested but signing configuration is missing: ${missingSigningKeys.join(', ')}")
}
def releaseSigningConfigured = missingSigningKeys.isEmpty()

android {
    namespace = "com.synctogether.com"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.synctogether.com"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            // Populated only when all owner-controlled values are present.
            if (releaseSigningConfigured) {
                storeFile file(signingEnvironment.ANDROID_KEYSTORE_PATH)
                storePassword signingEnvironment.ANDROID_KEYSTORE_PASSWORD
                keyAlias signingEnvironment.ANDROID_KEY_ALIAS
                keyPassword signingEnvironment.ANDROID_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            debuggable true
            minifyEnabled false
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // PHASE 14 — real ad SDKs. The Mobile Ads SDK is only ever initialized
    // after the UMP consent state machine permits an ad request.
    implementation "com.google.android.gms:play-services-ads:$playServicesAdsVersion"
    implementation "com.google.android.ump:user-messaging-platform:$userMessagingPlatformVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
