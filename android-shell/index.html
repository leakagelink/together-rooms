<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#140b24" />
    <title>SyncTogether</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(120% 90% at 50% 0%, #241340 0%, #150c28 45%, #0b0618 100%);
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
        color: #f5ecf1;
      }
      .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(70px);
        pointer-events: none;
        animation: drift 16s ease-in-out infinite;
      }
      .orb.a {
        width: 22rem;
        height: 22rem;
        top: -6rem;
        left: -5rem;
        background: rgba(255, 122, 89, 0.42);
      }
      .orb.b {
        width: 20rem;
        height: 20rem;
        right: -5rem;
        bottom: -6rem;
        background: rgba(255, 92, 138, 0.32);
        animation-delay: -6s;
      }
      .orb.c {
        width: 18rem;
        height: 18rem;
        top: 38%;
        left: 30%;
        background: rgba(139, 124, 246, 0.32);
        animation-delay: -11s;
      }
      .badge {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 112px;
        height: 112px;
      }
      .ring {
        position: absolute;
        inset: 0;
        border-radius: 34px;
        border: 1px solid rgba(255, 122, 89, 0.5);
        animation: ring 2s ease-out infinite;
      }
      .ring.two {
        border-color: rgba(255, 92, 138, 0.4);
        animation-delay: 0.6s;
      }
      .mark {
        width: 96px;
        height: 96px;
        border-radius: 30px;
        background: linear-gradient(135deg, #ff7a59, #ff5c8a 55%, #8b7cf6);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 22px 60px -14px rgba(255, 122, 89, 0.65);
        animation:
          pop 0.8s cubic-bezier(0.22, 1, 0.36, 1) both,
          float 4.5s ease-in-out 0.8s infinite;
      }
      .mark svg {
        width: 50px;
        height: 50px;
      }
      h1 {
        margin: 10px 0 0;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.02em;
        animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
      }
      p {
        margin: 0;
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(245, 236, 241, 0.5);
        animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.34s both;
      }
      .bar {
        margin-top: 14px;
        width: 160px;
        height: 4px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(245, 236, 241, 0.12);
      }
      .bar span {
        display: block;
        width: 50%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #ff7a59, #ff5c8a);
        animation: sweep 1.3s ease-in-out infinite;
      }
      @keyframes pop {
        0% {
          opacity: 0;
          transform: scale(0.7) rotate(-8deg);
        }
        60% {
          opacity: 1;
          transform: scale(1.06) rotate(2deg);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }
      @keyframes ring {
        0% {
          opacity: 0.9;
          transform: scale(0.85);
        }
        100% {
          opacity: 0;
          transform: scale(1.45);
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes sweep {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(220%);
        }
      }
      @keyframes drift {
        0%,
        100% {
          transform: translate3d(0, 0, 0) scale(1);
        }
        50% {
          transform: translate3d(4%, -4%, 0) scale(1.12);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="orb a"></div>
    <div class="orb b"></div>
    <div class="orb c"></div>
    <div class="badge" aria-hidden="true">
      <div class="ring"></div>
      <div class="ring two"></div>
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round">
          <path d="M8 5.5 19 12 8 18.5z" fill="#fff" stroke="none" />
        </svg>
      </div>
    </div>
    <h1>SyncTogether</h1>
    <p>Watch · Listen · Study</p>
    <div class="bar"><span></span></div>
  </body>
</html>
