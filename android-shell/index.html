<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a0f14" />
    <title>SyncTogether</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1a0f14;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
        color: #f5ecf1;
      }
      .glow {
        position: fixed;
        inset: 0;
        background: radial-gradient(
          ellipse 70% 45% at 50% 46%,
          rgba(255, 107, 138, 0.28),
          rgba(139, 124, 246, 0.12) 55%,
          transparent 75%
        );
        pointer-events: none;
      }
      .mark {
        width: 96px;
        height: 96px;
        border-radius: 28px;
        background: linear-gradient(135deg, #ff6b8a, #ff9a62 55%, #8b7cf6);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 18px 50px -12px rgba(255, 107, 138, 0.55);
        animation: pulse 1.8s ease-in-out infinite;
      }
      .mark svg {
        width: 52px;
        height: 52px;
      }
      h1 {
        margin: 0;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        font-size: 13px;
        color: rgba(245, 236, 241, 0.55);
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.06);
        }
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round">
        <path d="M8 5.5 19 12 8 18.5z" fill="#fff" stroke="none" />
      </svg>
    </div>
    <h1>SyncTogether</h1>
    <p>Connecting to SyncTogether…</p>
  </body>
</html>
