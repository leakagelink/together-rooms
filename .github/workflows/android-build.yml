# PHASE 14.1 — Android compilation verification.
#
# Purpose: prove that the native Android project actually COMPILES on every
# change that touches it. This workflow deliberately does not sign, publish or
# deploy anything, and needs no secrets: the debug variant is signed with the
# throwaway Android debug keystore that the SDK generates locally.
name: Android build verification

on:
  push:
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # JDK 21: android/app/build.gradle sets source/targetCompatibility 21,
      # and AGP 8.13 requires JDK 17 or newer.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk 36 + build tools must be present before Gradle configures.
      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # The Capacitor Android project references node_modules/@capacitor/*, and
      # the web assets must exist before sync copies them.
      - name: Build web assets
        run: bun run build

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Static Android build-blocker checks
        run: bunx vitest run src/lib/ads/android-build.test.ts

      - uses: gradle/actions/setup-gradle@v4

      # The real compilation gate. assembleDebug compiles every Java source,
      # including the Phase 14 ad bridge, against the pinned SDKs.
      - name: Compile debug variant
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --console=plain --stacktrace

      # Verifies the release toolchain (R8 shrinking + the Phase 14.1 keep
      # rules) without any keystore: the output is intentionally unsigned and
      # is never uploaded anywhere.
      - name: Verify release compilation and shrinking (unsigned)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --console=plain --stacktrace
